<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>درس | Profaycel</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2563eb">
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="moteur.css?v=3">
</head>
<body>
<nav class="pf-nav no-print"><div class="wrap"><a class="pf-logo" href="../index.html">Profaycel</a><a href="index.html">📚 دروسي</a><a href="../eleve.html">🏠 فضائي</a></div></nav>
<div class="prof-bande">الأستاذ فيصل خليفي</div>
<header class="top">
  <div class="wrap">
    <div>
      <h1 id="titre" dir="auto">…</h1>
      <small id="sous"></small>
    </div>
  </div>
</header>
<main class="wrap" id="app"><div class="carte chargement">⏳ تحميل…</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="../supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous"></script>
<script src="../apercu.js?v=1"></script>
<script src="moteur.js?v=7"></script>
<script src="geo.js?v=2"></script>
<script src="certificat.js?v=2"></script>
<script src="catalogue.js?v=17"></script>
<script>
(function () {
    const id = new URLSearchParams(location.search).get("l");
    const l = window.CATALOGUE_PAR_ID[id];
    if (!l) {
        document.getElementById("app").innerHTML = `<div class="carte centre"><h2>الدرس غير موجود</h2><a class="btn" href="index.html" style="text-decoration:none">← كلّ الدروس</a></div>`;
        return;
    }
    document.getElementById("titre").textContent = l.titre;
    document.getElementById("sous").textContent = "رياضيات · " + l.niveau + (l.partie === "geometrie" ? " · هندسة" : "");
    // Le contenu des leçons est dans le stockage privé : lu seulement par un compte connecté, et seulement pour son niveau
    (async function () {
        const app = document.getElementById("app");
        try {
            if (!await attendreSupabase()) { throw new Error("connexion"); }
            const { data: { session } } = await sb().auth.getSession();
            if (!session) { location.href = "../login.html"; return; }
            const r = await sb().storage.from("lecons").download("lecons/" + l.f + ".js");
            if (r.error || !r.data) {
                app.innerHTML = `<div class="carte centre"><h2>لا يمكن فتح هذا الدرس</h2><p>هذا الدرس ليس من مستواك، أو تعذّر الاتّصال.</p><a class="btn" href="index.html" style="text-decoration:none">← كلّ الدروس</a></div>`;
                return;
            }
            const sc = document.createElement("script");
            sc.textContent = await r.data.text();
            document.body.appendChild(sc);
            window.LECON = window.LECONS && window.LECONS[id];
            if (!window.LECON) { throw new Error("vide"); }
            demarrer();
        } catch (e) {
            console.error("Erreur leçon:", e);
            app.innerHTML = `<div class="carte centre">تعذّر تحميل الدرس. تحقّق من الأنترنت.</div>`;
        }
    })();
})();
</script>
</body>
</html>
