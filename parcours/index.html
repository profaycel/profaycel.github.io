<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دروسي | Profaycel</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2563eb">
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="moteur.css?v=1">
<style>
  .lecon{text-decoration:none}
  .lecon .prog{margin:8px 0 0;height:8px}
  .badge{font-size:14px;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
  .badge.or{background:#fef3c7;color:#92400e}
  .badge.vert{background:var(--vert-clair);color:#14532d}
  .section{margin:22px 4px 4px;color:var(--gris);font-weight:700}
  .certifs a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--bord);border-radius:12px;margin:8px 0;text-decoration:none;color:inherit;background:#fffbeb}
</style>
</head>
<body>
<nav class="pf-nav"><div class="wrap"><a class="pf-logo" href="../index.html">Profaycel</a><a href="../eleve.html">🏠 فضائي</a></div></nav>
<div class="prof-bande">الأستاذ فيصل خليفي</div>
<header class="top"><div class="wrap"><div><h1>دروسي التفاعليّة</h1><small id="sousTitre">رياضيات · الثلاثي الأوّل</small></div></div></header>
<main class="wrap" id="app"><div class="carte chargement">⏳ تحميل…</div></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase.js"></script>
<script src="catalogue.js?v=1"></script>
<script>
const sb = () => window.supabaseClient;
const N = s => `<span class="ltr">${s}</span>`;

async function lancer() {
    for (let i = 0; i < 100 && !sb(); i++) await new Promise(r => setTimeout(r, 100));
    const app = document.getElementById("app");
    if (!sb()) { app.innerHTML = `<div class="carte centre">تعذّر الاتّصال. أعد تحميل الصفحة.</div>`; return; }
    const { data: { session } } = await sb().auth.getSession();
    if (!session) { location.href = "../login.html"; return; }
    const user = session.user, role = (user.user_metadata || {}).role;
    const admin = role === "admin" || (user.email || "").toLowerCase() === "faycel.khlifiii@gmail.com";
    if (!admin && role !== "eleve") { location.href = "../index.html"; return; }

    const [fiche, prog, certs] = await Promise.all([
        sb().from("eleves").select("prenom,nom,classe").eq("user_id", user.id).limit(1),
        sb().from("progression").select("*").eq("user_id", user.id),
        sb().from("certificats").select("*").eq("user_id", user.id).order("delivre_le")
    ]);
    const eleve = (fiche.data || [])[0] || {};
    const parId = Object.fromEntries((prog.data || []).map(p => [p.lecon, p]));
    const certParId = Object.fromEntries((certs.data || []).map(c => [c.lecon, c]));

    // Leçons du niveau de l'élève (tout pour l'administrateur ou si le niveau n'est pas encore connu)
    const voirTout = admin || new URLSearchParams(location.search).has("tout");
    let lecons = window.CATALOGUE.filter(l => voirTout || !eleve.classe || l.niveau === eleve.classe);
    if (eleve.classe) document.getElementById("sousTitre").innerHTML = "رياضيات · <bdi>" + eleve.classe + "</bdi> · الثلاثي الأوّل";

    let faits = 0, tous = 0;
    const carteLecon = l => {
        const p = parId[l.id] || {}, et = (p.etoiles || []).filter(x => x > 0).length + (p.examen_score != null ? 1 : 0);
        const pc = Math.round(100 * et / (l.n + 1)); faits += et; tous += l.n + 1;
        const c = certParId[l.id];
        const badge = c ? '<span class="badge or">🎓 شهادة</span>' : pc > 0 ? `<span class="badge vert ltr">${pc}%</span>` : "";
        return `<a class="niveau lecon" href="lecon.html?l=${l.id}">
          <span class="num">${c ? "✓" : l.partie === "geometrie" ? "📐" : "🔢"}</span>
          <span class="info"><span class="titre">${l.titre}</span><br><span class="sous">${l.sous}</span>
            <div class="prog"><div style="width:${pc}%"></div></div></span>${badge}</a>`;
    };
    const alg = lecons.filter(l => l.partie === "algebre").map(carteLecon).join("");
    const geo = lecons.filter(l => l.partie === "geometrie").map(carteLecon).join("");
    const pt = tous ? Math.round(100 * faits / tous) : 0;
    const prenom = eleve.prenom || (user.user_metadata || {}).full_name || "";

    let h = `<div class="carte">
        <h2>مرحبا ${prenom} 👋</h2>
        <div style="color:var(--gris)">كلّ درس فيه مستويات تُفتح واحدا بعد الآخر. أجب عن الأسئلة لتفتح المستوى الموالي، وفي الآخر امتحان و<b>شهادة رسميّة</b> باسمك 🎓</div>
        <div class="prog"><div style="width:${pt}%"></div></div>
        <small style="color:var(--gris)">تقدّمك: ${N(pt + "%")} · الشهادات: ${N((certs.data || []).length + " / " + lecons.length)} 🎓</small>
      </div>`;
    if (!lecons.length) {
        h += `<div class="carte centre"><h3>دروس مستواك في الطريق ✍️</h3><p>الدروس التفاعليّة متوفّرة حاليّا للسنة الثامنة أساسي.</p><a href="?tout=1">عرض كلّ الدروس</a></div>`;
    } else {
        if (alg) h += `<div class="section">🔢 الجبر والحساب</div>${alg}`;
        if (geo) h += `<div class="section">📐 الهندسة</div>${geo}`;
    }
    if ((certs.data || []).length) {
        h += `<div class="section">🎓 شهاداتي</div><div class="certifs">` + certs.data.map(c =>
            `<a href="certificat.html?n=${encodeURIComponent(c.numero)}"><span><b>${c.titre}</b><br><small class="ltr" style="color:var(--gris)">${c.numero}</small></span><span class="badge or">عرض ←</span></a>`).join("") + `</div>`;
    }
    app.innerHTML = h;
}
lancer();
</script>
</body>
</html>
